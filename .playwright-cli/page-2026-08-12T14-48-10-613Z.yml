              - paragraph [ref=f1e205]: MODEL WORK // ACTUAL TASKS
              - heading "NOT “AI ANALYSIS.” SIX SPECIFIC JOBS." [level=2] [ref=f1e206]
            - paragraph [ref=f1e207]: The advantage was not that the model “understood war.” It was that it could apply the same narrow measurements to thousands of consecutive frames, then hand uncertain cases to a person.
          - generic [ref=f1e208]:
            - article [ref=f1e209]:
              - generic [ref=f1e210]: TASK_01
              - heading "APPROACH GEOMETRY" [level=3] [ref=f1e217]
              - paragraph [ref=f1e218]: Track the incoming drone across successive frames, estimate bearing changes, and separate a real turn from camera roll or editorial cutting.
            - article [ref=f1e219]:
              - generic [ref=f1e220]: TASK_02
              - heading "TARGET CLASSIFICATION" [level=3] [ref=f1e227]
              - paragraph [ref=f1e228]: Distinguish a soldier, vehicle, armoured platform, earthmover, structure or technical system before a human validates the label.
            - article [ref=f1e229]:
              - generic [ref=f1e230]: TASK_03
              - heading "FRAME-LEVEL COUNTS" [level=3] [ref=f1e237]
              - paragraph [ref=f1e238]: Maintain candidate counts of visible people through motion and partial occlusion instead of relying on one memorable still frame.
            - article [ref=f1e239]:
              - generic [ref=f1e240]: TASK_04
              - heading "MOVEMENT VECTORS" [level=3] [ref=f1e247]
              - paragraph [ref=f1e248]: Measure where visible people move or run, over how many frames, and whether the apparent direction persists after camera motion is removed.
            - article [ref=f1e249]:
              - generic [ref=f1e250]: TASK_05
              - heading "IMPACT RELATIONSHIPS" [level=3] [ref=f1e257]
              - paragraph [ref=f1e258]: Compare the terminal frame, target position and visible blast envelope. It does not infer a casualty from an explosion alone.
            - article [ref=f1e259]:
              - generic [ref=f1e260]: TASK_06
              - heading "REVIEW PRIORITY" [level=3] [ref=f1e267]
              - paragraph [ref=f1e268]: Surface uncertain, contradictory or high-consequence segments first so human attention is spent where a wrong label would matter most.
        - generic [ref=f1e270]:
          - generic [ref=f1e271]:
            - paragraph [ref=f1e276]: WHY THE MODEL MATTERED
            - heading "A HUMAN SEES CONTEXT. A MODEL HOLDS THE SAME MEASUREMENT ACROSS EVERY FRAME." [level=2] [ref=f1e277]
            - list [ref=f1e278]:
              - listitem [ref=f1e279]: 01It does not forget the previous frame when the camera rolls, vibrates or cuts.
              - listitem [ref=f1e280]: 02It can revisit every candidate person and vehicle with the same threshold instead of a changing impression.
              - listitem [ref=f1e281]: "03It turns motion into a review trail: frame, time, track and confidence—not just a conclusion."
              - listitem [ref=f1e282]: 04It finds the small contradictory segment a human may miss after hours of repetitive footage.
          - generic [ref=f1e283]:
            - paragraph [ref=f1e287]: WHY THE HUMAN REMAINED ESSENTIAL
            - heading "A TRACK IS NOT A FACT UNTIL THE IMAGE AND THE SOURCE CAN SUPPORT IT." [level=2] [ref=f1e288]
            - list [ref=f1e289]:
              - listitem [ref=f1e290]: Unknown camera field of view and lens distortion
              - listitem [ref=f1e291]: Compression, dropped frames and edited sequences
              - listitem [ref=f1e292]: No reliable scale reference in many scenes
              - listitem [ref=f1e293]: Rolling shutter, vibration and terminal signal loss
              - listitem [ref=f1e294]: Occlusion by terrain, smoke, vehicles or structures
              - listitem [ref=f1e295]: Casualty outcomes require external corroboration
            - paragraph [ref=f1e296]: The model can indicate that three figures were visible before an impact. It cannot, from that image alone, establish who they were or what happened after the camera feed ended.
